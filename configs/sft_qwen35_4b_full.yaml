# Full-parameter SFT baseline on the same frozen data/protocol as LoRA SFT.
model_name_or_path: /data3/xs/models/Qwen3.5-4B-Base
trust_remote_code: true

stage: sft
do_train: true
do_eval: true
finetuning_type: full
deepspeed: /data0/xs/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

dataset_dir: /data0/xs/search/data/processed/search_sft_qwen35_4b
dataset: searchqa_sft_train_15k
eval_dataset: searchqa_sft_eval
template: qwen3_5
cutoff_len: 4096
preprocessing_num_workers: 8
dataloader_num_workers: 2

output_dir: /data0/xs/search/outputs/sft_qwen35_4b_full_multiturn_masked
resume_from_checkpoint: /data0/xs/search/outputs/sft_qwen35_4b_full_multiturn_masked/checkpoint-500
logging_steps: 1
save_steps: 250
save_total_limit: 2
eval_strategy: steps
eval_steps: 250
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
overwrite_output_dir: false
report_to: swanlab
swanlab_project: search-r1
swanlab_run_name: qwen35-4b-full-multiturn-policy-mask-resume-step500

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
